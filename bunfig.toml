# Bun runtime / test configuration (PJ1-198)
# Prefer package scripts (`bun run test:bun`) over bare `bun test`.

[test]
# Playwright specs and Vitest-only suites must not be picked up accidentally.
pathIgnorePatterns = ["e2e/**", "**/node_modules/**"]
# Allow importing server-only modules in Bun unit tests (see scripts/bun-server-only-stub.ts).
preload = ["./scripts/bun-server-only-stub.ts"]
